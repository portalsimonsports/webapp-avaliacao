<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f3d66">
  <link rel="manifest" href="./manifest.webmanifest?v=5">
  <title>WebApp Avaliação</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f8;color:#14213d}body{min-height:100vh;background:linear-gradient(180deg,#0f3d66 0 210px,#eef3f8 210px)}.wrap{max-width:560px;margin:0 auto;padding:32px 16px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.16)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#0f3d66;color:#fff;font-weight:800}.brand h1{font-size:1.35rem;margin:0}.brand p{margin:4px 0 0;color:#667085}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.tabs button{margin:0}.tabs button.alt{background:#eef3f8;color:#16324f}.tabs button.active{background:#7c4dff;color:#fff}label{display:block;margin:13px 0 7px;font-weight:700}input{width:100%;padding:14px 15px;border:1px solid #cbd5e1;border-radius:12px;outline:none;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:14px 16px;background:#0f3d66;color:#fff;font-weight:800;cursor:pointer;margin-top:18px}.status{min-height:24px;margin:12px 0 0}.ok{color:#17633a}.erro{color:#b42318}.hidden{display:none}.painel{margin-top:6px}.painel h2{margin:0 0 8px;font-size:1.15rem}.modulo{display:block;text-decoration:none;background:#f4f7fb;border:1px solid #dbe4ee;border-radius:14px;padding:16px;color:#16324f;font-weight:800;text-align:center;margin-top:10px}@media(max-width:420px){.tabs{grid-template-columns:1fr}.card{padding:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand"><div class="logo">WA</div><div><h1>WebApp Avaliação</h1><p>Acesso institucional</p></div></div>
      <div id="acesso">
        <div class="tabs"><button id="btnAluno" type="button" class="active">Área do Aluno</button><button id="btnAdmin" type="button" class="alt">Painel do Administrador</button></div>
        <form id="loginForm" autocomplete="off">
          <label for="codigo">Código / Usuário</label><input id="codigo" required>
          <label for="senha">Senha</label><input id="senha" type="password" required>
          <button id="btnEntrar" type="submit">Entrar</button>
          <p id="status" class="status" role="status"></p>
        </form>
      </div>
      <section id="painel" class="painel hidden"><h2 id="usuarioNome">Usuário</h2><div id="modulos"></div><button id="btnSair" type="button">Sair</button></section>
    </section>
  </main>
  <script src="./config.js?v=5"></script>
  <script src="./app.js?v=5"></script>
</body>
</html>
